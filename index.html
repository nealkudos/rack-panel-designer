<title>Rack Panel Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: CAD-style workbench. Library left, panel canvas centre, inspector right; stacks on narrow screens. */
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#141b22; --muted:#5a6774; --line:#d2d9e0;
  --accent:#1d5bd6; --accent-ink:#ffffff; --accent-soft:#dfe8fb;
  --canvas:#dde3e9; --canvas-grid:#cfd6dd;
  --ok:#1f7a4a; --warn:#b45309; --bad:#c2321f; --ok-soft:#e1f2e8; --warn-soft:#fbeedd; --bad-soft:#fbe3df;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161b; --surface:#1a2027; --surface-2:#202831; --ink:#e6ebf0; --muted:#94a2b0; --line:#2e3843;
  --accent:#6d9cff; --accent-ink:#0b1220; --accent-soft:#1e2c47;
  --canvas:#0d1115; --canvas-grid:#1b222a;
  --ok:#4cc38a; --warn:#f0a35a; --bad:#ff7b6b; --ok-soft:#173326; --warn-soft:#3a2a17; --bad-soft:#3d1d19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161b; --surface:#1a2027; --surface-2:#202831; --ink:#e6ebf0; --muted:#94a2b0; --line:#2e3843;
  --accent:#6d9cff; --accent-ink:#0b1220; --accent-soft:#1e2c47;
  --canvas:#0d1115; --canvas-grid:#1b222a;
  --ok:#4cc38a; --warn:#f0a35a; --bad:#ff7b6b; --ok-soft:#173326; --warn-soft:#3a2a17; --bad-soft:#3d1d19;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:12px 32px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.app{max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.brand small{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--muted);font-weight:600}
.brand h1{font-size:26px;font-weight:700;letter-spacing:.01em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.libitem:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.09em;font-size:11px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:5px 8px;min-width:0}
input[type=number]{font-family:var(--f-mono);font-size:13px}
textarea{resize:vertical;min-height:60px}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.settings .wide{grid-column:span 2}
.work{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:12px;align-items:start}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.pane-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.pane-h h2{font-size:16px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.lib{display:flex;flex-direction:column;max-height:calc(100vh - 40px);position:sticky;top:12px}
.lib-search{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lib-list{overflow:auto;padding:4px 0 10px}
.cat{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;font-weight:700;color:var(--muted);padding:12px 12px 4px}
.libitem{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:5px 12px;cursor:pointer}
.libitem:hover,.libitem.cur{background:var(--surface-2)}
.libitem.cur{box-shadow:inset 3px 0 0 var(--accent)}
.libitem svg{width:34px;height:30px}
.libitem .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libitem .pn{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.high{background:var(--ok)} .dot.med{background:var(--warn)} .dot.low{background:var(--bad)}
.chip{font-family:var(--f-display);font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.high{background:var(--ok-soft);color:var(--ok)} .chip.med{background:var(--warn-soft);color:var(--warn)} .chip.low{background:var(--bad-soft);color:var(--bad)}
.lib-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
details summary{cursor:pointer;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:13px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.formgrid .full{grid-column:1/-1}
.canvas-pane{display:flex;flex-direction:column}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.stage{background:var(--canvas);overflow:auto;padding:18px;min-height:140px;touch-action:none}
.stage svg{display:block;margin:0 auto;user-select:none;-webkit-user-select:none}
.status{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;padding:6px 12px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.status b{color:var(--ink);font-weight:500}
.sched{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;color:var(--muted);text-align:left;font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr.sel td{background:var(--accent-soft)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
.insp{display:flex;flex-direction:column;position:sticky;top:12px;max-height:calc(100vh - 40px);overflow:auto}
.insp-body{padding:12px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12.5px;color:var(--muted)}
.warnlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.warnlist li{font-size:13px;padding:6px 8px;border-radius:5px;background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn)}
.warnlist li.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.warnlist li.ok{background:var(--ok-soft);border-left-color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:13.5px;z-index:20;max-width:calc(100% - 32px)}
.mono{font-family:var(--f-mono)}
a{color:var(--accent)}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}
@media (max-width:1180px){.work{grid-template-columns:240px minmax(0,1fr)}.insp{grid-column:1/-1;position:static;max-height:none}}
@media (max-width:760px){.work{grid-template-columns:minmax(0,1fr)}.lib{position:static;max-height:420px}.settings .wide{grid-column:span 1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><small>Kudos AV · Fabrication</small><h1>Rack Panel Designer</h1></div>
    <div class="row">
      <label class="field" style="min-width:180px"><span>Panel</span><select id="panelSel"></select></label>
      <button class="btn" id="bNew" title="Start a new blank panel">New</button>
      <button class="btn" id="bDup" title="Duplicate this panel">Duplicate</button>
      <span id="delWrap"><button class="btn danger" id="bDel">Delete</button></span>
    </div>
    <div class="row">
      <button class="btn" id="bOpen">Open project</button>
      <button class="btn" id="bSave">Save project</button>
      <button class="btn" id="bSvg">SVG</button>
      <button class="btn" id="bDxf" hidden>DXF</button>
      <button class="btn" id="bPdf">PDF drawing</button>
      <button class="btn primary" id="bZip">Fabrication pack</button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
  </header>

  <section class="settings" aria-label="Panel settings">
    <label class="field wide"><span>Panel name</span><input id="sName"></label>
    <label class="field wide"><span>Job</span><input id="sJob"></label>
    <label class="field"><span>Client</span><input id="sClient"></label>
    <label class="field"><span>Rack</span><select id="sRack"><option value="19">19" (482.6)</option><option value="10">10" (254.0)</option></select></label>
    <label class="field"><span>Height</span><select id="sU"></select></label>
    <label class="field"><span>Thickness</span><select id="sThick"><option>1.5</option><option>2</option><option>2.5</option><option>3</option><option>4</option><option>5</option></select></label>
    <label class="field"><span>Finish</span><select id="sFinish"><option value="black">Black anodised</option><option value="natural">Natural / clear anodised</option><option value="white">White powder coat</option></select></label>
    <label class="field"><span>Rack fixings</span><select id="sFix"><option value="slot">Slot 10 × 6.5</option><option value="round">Hole Ø6.5</option></select></label>
    <label class="field"><span>D-size screws</span><select id="sDfix"><option value="four">All 4 positions</option><option value="tlbr">2: top-L / bottom-R</option><option value="trbl">2: top-R / bottom-L</option></select></label>
    <label class="field"><span>Qty</span><input id="sQty" type="number" min="1" step="1"></label>
    <label class="field"><span>Drawn by</span><input id="sBy"></label>
  </section>

  <div class="work">
    <aside class="pane lib" aria-label="Connector library">
      <div class="pane-h"><h2>Library</h2><span class="note" id="libCount"></span></div>
      <div class="lib-search">
        <input id="q" type="search" placeholder="Search: XLR, etherCON, NE8FDP, IEC…" aria-label="Search the library">
        <div class="row note"><span class="chip high"><i class="dot high"></i>Datasheet</span><span class="chip med"><i class="dot med"></i>Check</span><span class="chip low"><i class="dot low"></i>Verify</span></div>
      </div>
      <div class="lib-list" id="libList"></div>
      <div class="lib-foot">
        <details id="rowForm">
          <summary>Add a row</summary>
          <div class="formgrid">
            <label class="field full"><span>Part</span><select id="rPart"></select></label>
            <label class="field"><span>Count</span><input id="rN" type="number" min="1" max="60" value="8"></label>
            <label class="field"><span>Pitch mm</span><input id="rPitch" type="number" step="0.5" value="32"></label>
            <label class="field"><span>Centre Y mm</span><input id="rY" type="number" step="0.5"></label>
            <label class="field"><span>Centre X mm</span><input id="rX" type="number" step="0.5"></label>
            <label class="field"><span>Label prefix</span><input id="rPre" placeholder="e.g. CH "></label>
            <label class="field"><span>Start no.</span><input id="rStart" type="number" value="1"></label>
            <button class="btn primary full" id="rGo">Add row</button>
          </div>
        </details>
        <details id="custForm">
          <summary>Custom part</summary>
          <p class="note" style="margin:6px 0 0">For anything not listed. Take the sizes from the maker's cutout drawing.</p>
          <div class="formgrid">
            <label class="field full"><span>Name</span><input id="cName" placeholder="e.g. Lemo 1B panel"></label>
            <label class="field"><span>Part no.</span><input id="cPn"></label>
            <label class="field"><span>Shape</span><select id="cShape"><option value="circle">Round</option><option value="rect">Rectangle</option><option value="dflat">Round with flat</option></select></label>
            <label class="field"><span>Ø / width</span><input id="cW" type="number" step="0.1" value="20"></label>
            <label class="field"><span>Height / flat</span><input id="cH" type="number" step="0.1" value="0"></label>
            <label class="field"><span>Corner R</span><input id="cR" type="number" step="0.1" value="0"></label>
            <label class="field"><span>Screws</span><select id="cHoles"><option value="none">None</option><option value="h2">2 horizontal</option><option value="v2">2 vertical</option><option value="d2">2 diagonal</option><option value="q4">4 corners</option></select></label>
            <label class="field"><span>Screw pitch X</span><input id="cPx" type="number" step="0.1" value="0"></label>
            <label class="field"><span>Screw pitch Y</span><input id="cPy" type="number" step="0.1" value="0"></label>
            <label class="field"><span>Screw hole Ø</span><input id="cHd" type="number" step="0.1" value="3.2"></label>
            <label class="field"><span>Flange W</span><input id="cFw" type="number" step="0.1" value="26"></label>
            <label class="field"><span>Flange H</span><input id="cFh" type="number" step="0.1" value="26"></label>
            <button class="btn primary full" id="cGo">Save to library</button>
          </div>
        </details>
      </div>
    </aside>

    <section class="pane canvas-pane" aria-label="Panel canvas">
      <div class="toolbar">
        <button class="btn sm on" id="vCut" title="Show holes as cut">Cutouts</button>
        <button class="btn sm" id="vFit" title="Show connectors fitted">Fitted</button>
        <button class="btn sm on" id="vNames" title="Show each connector's reference and type on the drawing (not engraved)" aria-pressed="true">Part names</button>
        <span class="sep"></span>
        <label class="row note">Grid <select id="grid" aria-label="Snap grid"><option value="0.1">0.1</option><option value="0.5">0.5</option><option value="1">1</option><option value="2.5">2.5</option><option value="5">5</option></select></label>
        <button class="btn sm" id="zOut" aria-label="Zoom out">−</button>
        <button class="btn sm" id="zFit">Fit</button>
        <button class="btn sm" id="zIn" aria-label="Zoom in">+</button>
        <span class="sep"></span>
        <button class="btn sm" id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
        <button class="btn sm" id="bRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
        <span class="sep"></span>
        <button class="btn sm" id="tText">+ Text</button>
        <button class="btn sm" id="tBox">+ Box</button>
        <button class="btn sm" id="tLogo" title="Upload a logo to engrave (SVG, PNG or JPG)">+ Logo</button>
        <input type="file" id="logoIn" accept=".svg,.png,.jpg,.jpeg,.webp,image/svg+xml,image/png,image/jpeg,image/webp" hidden>
      </div>
      <div class="stage" id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="status"><span>X <b id="cx">—</b> · Y <b id="cy">—</b> <span>mm from bottom-left</span></span><span id="stWarn"></span><span>Drag to move · Shift-click to multi-select · Arrows nudge</span></div>
      <div class="sched"><table><thead><tr><th>Ref</th><th>Part</th><th>Part no.</th><th style="text-align:right">X</th><th style="text-align:right">Y</th><th>Label</th><th>Status</th></tr></thead><tbody id="schedBody"></tbody></table></div>
    </section>

    <aside class="pane insp" aria-label="Inspector">
      <div class="pane-h"><h2 id="inspTitle">Panel</h2></div>
      <div class="insp-body" id="insp"></div>
    </aside>
  </div>
</div>

<script>
(()=>{
'use strict';
/* ============ Connector library ============
   Units mm, coordinates from connector centre, x right / y up, viewed from the FRONT.
   conf: high = taken from maker's datasheet, med = trade standard / partly confirmed, low = verify with maker's drawing before cutting. */
const DSIZE = {cut:[{t:'circle',d:24}], holes:'D', flange:{w:26,h:31,r:2}, desc:'Ø24.0 + 2×Ø3.2 (M3) on 19×24 diagonal — Neutrik D-size', conf:'high',
  src:'https://media.iewc.com/SpecificationSheets/NL4MP-B.pdf'};
const LIB = [];
const add = (cat,id,name,pn,def)=>LIB.push(Object.assign({cat,id,name,pn},def));
const D = (cat,id,name,pn,extra={})=>add(cat,id,name,pn,Object.assign({},DSIZE,extra));
const circ = d=>({t:'circle',d});
const rect = (w,h,r=0,dx=0,dy=0)=>({t:'rect',w,h,r,dx,dy});
const q4 = (px,py,d)=>[[-px/2,py/2],[px/2,py/2],[px/2,-py/2],[-px/2,-py/2]].map(([x,y])=>({x,y,d}));
const h2 = (p,d)=>[{x:-p/2,y:0,d},{x:p/2,y:0,d}];

// Audio
D('Audio','nc3fd','XLR 3-pin female','NC3FD-L-1');
D('Audio','nc3md','XLR 3-pin male','NC3MD-L-1');
D('Audio','nc4fd','XLR 4-pin female','NC4FD-L-1');
D('Audio','nc4md','XLR 4-pin male','NC4MD-L-1');
D('Audio','nj3fp6c','1/4" jack, stereo','NJ3FP6C');
add('Audio','ncj6fa','XLR / jack combo','NCJ6FA-H',{cut:[circ(22)],holes:[{x:-9.9,y:9.9,d:3.2},{x:9.9,y:-9.9,d:3.2}],flange:{w:25,h:25,r:2},desc:'Ø22.0 + 2×Ø3.2 on 19.8×19.8 diagonal (A-series, rear mount)',conf:'med',note:'A-series cutout, not D-size. Diagonal direction not confirmed; check the Neutrik drawing.',src:'https://www.neutrik.com/media/8443/download/Drawing%20NCJ6FA-H.pdf?v=4'});
// DMX / lighting
D('DMX & lighting','nc5fd','XLR 5-pin female (DMX out)','NC5FD-L-1');
D('DMX & lighting','nc5md','XLR 5-pin male (DMX in)','NC5MD-L-1');
add('DMX & lighting','socapex19','Socapex 19-pin receptacle','Amphenol SL61 / SLDEF419',{cut:[circ(42.2)],holes:q4(34,34,3.5),flange:{w:46,h:46,r:3},desc:'Ø42.2 + 4×Ø3.5 on 34 square',conf:'low',note:'Shell size 30 assumed. Catalogue columns unlabelled. Get the Amphenol drawing before cutting. Needs 2U or more.',src:'https://docs.rs-online.com/3ea1/A700000009172906.pdf'});
// Data & video
D('Data & video','ne8fdp','etherCON RJ45 Cat5e','NE8FDP');
D('Data & video','ne8fdx','etherCON Cat6A','NE8FDX-P6');
D('Data & video','no2','opticalCON DUO','NO2-4FDW-A');
D('Data & video','no4','opticalCON QUAD','NO4FDW-A');
D('Data & video','no12','opticalCON MTP 12','NO12FDW-A');
D('Data & video','nbb75dfg','BNC 75Ω (3G/12G SDI)','NBB-75DFG');
D('Data & video','nbb75dfi','BNC 75Ω isolated','NBB-75DFI');
D('Data & video','nausb','USB A/B feedthrough','NAUSB-W');
D('Data & video','nahdmi','HDMI feedthrough','NAHDMI-W');
D('Data & video','dgen','Other D-size insert','Any D-size (Amphenol, Switchcraft EH…)',{note:'Use for any connector sold in the Neutrik D-size housing.'});
add('Data & video','bnc38','BNC bulkhead, nut mount','Amphenol 31-series 3/8-32',{cut:[{t:'dflat',d:9.5,f:3.95}],holes:[],flange:{w:14,h:14,round:true},desc:'Ø9.5 with one flat 8.7 across, nut mount',conf:'med',src:'https://www.alldatasheet.com/html-pdf/455739/AMPHENOL/31-321-RFX/4317/11/31-321-RFX.html'});
add('Data & video','keystone','Keystone jack','Keystone 14.9×19.4',{cut:[rect(14.9,19.4)],holes:[],flange:{w:17,h:22,r:1},desc:'14.9 × 19.4 rectangle, snap-in',conf:'med',note:'Snap-in fit depends on panel thickness (most suit 1.5–2 mm).'});

function examplePanel(){
  const p=blankPanel('SB-1 stage box (example)');
  p.job='Example — replace with your job'; p.U=1;
  const W=482.6, y=24, pitch=34, n=12, x0=W/2-pitch*(n-1)/2;
  const parts=['nc3fd','nc3fd','nc3fd','nc3fd','nc3fd','nc3fd','nc3fd','nc3fd','ne8fdp','ne8fdp','nac3mpx','nac3mpxtop'];
  const labels=['1','2','3','4','5','6','7','8','NET A','NET B','MAINS IN','THRU'];
  parts.forEach((pt,i)=>p.items.push({id:uid(),kind:'part',part:pt,x:+(x0+i*pitch).toFixed(2),y,rot:0,label:{text:labels[i],pos:'below',size:3}}));

function blankPanel(name){return {id:uid(),name:name||'New panel',job:'',client:'',rack:'19',U:1,thick:'2',finish:'black',fix:'slot',dfix:'four',qty:1,by:'Neal Chauhan',notes:'',items:[]};}
function load(){
  try{const s=JSON.parse(localStorage.getItem(LS)||'null'); if(s&&Array.isArray(s.panels)&&s.panels.length){panels=s.panels;cur=Math.min(s.cur||0,panels.length-1);customs=s.customs||[];logos=s.logos||[];return;}}catch(e){}
  panels=[examplePanel()];cur=0;
}
let saveT;
function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify({panels,cur,customs,logos}))}catch(e){}},300);}
function snapshot(){return JSON.stringify(P());}
function pushUndo(){undo.push(snapshot()); if(undo.length>80)undo.shift(); redo=[];}
function doUndo(){if(!undo.length)return; redo.push(snapshot()); panels[cur]=JSON.parse(undo.pop()); pruneSel(); renderAll();}
function doRedo(){if(!redo.length)return; undo.push(snapshot()); panels[cur]=JSON.parse(redo.pop()); pruneSel(); renderAll();}
function pruneSel(){const ids=new Set(P().items.map(i=>i.id)); for(const s of [...sel]) if(!ids.has(s)) sel.delete(s);}

/* ============ Geometry ============ */
const rackW=p=>p.rack==='10'?254:482.6;
const panelH=p=>+(p.U*44.45-0.8).toFixed(2);
const holePitch=p=>p.rack==='10'?236.5:465.1;
const opening=p=>p.rack==='10'?222.25:450;
function mountHoles(p){
  const W=rackW(p), hx=(W-holePitch(p))/2, out=[];
  for(let k=0;k<p.U;k++){const b=k*44.45-0.4; for(const yy of [b+6.35,b+38.1]) for(const x of [hx,W-hx]) out.push({x:+x.toFixed(3),y:+yy.toFixed(3)});}
  return out;
}
const rad=a=>a*Math.PI/180;
function contourLocal(c){
  const dx=c.dx||0, dy=c.dy||0; const segs=[];
  const L=(x1,y1,x2,y2)=>{if(Math.hypot(x2-x1,y2-y1)>1e-6)segs.push({t:'L',x1:x1+dx,y1:y1+dy,x2:x2+dx,y2:y2+dy});};
  const A=(cx,cy,r,a1,a2)=>{if(r>1e-6)segs.push({t:'A',cx:cx+dx,cy:cy+dy,r,a1,a2});};
  if(c.t==='circle') return {circle:true,cx:dx,cy:dy,r:c.d/2};
  if(c.t==='rect'){
    const w=c.w/2,h=c.h/2,r=Math.min(c.r||0,w,h);
    L(-w+r,-h,w-r,-h); A(w-r,-h+r,r,270,360); L(w,-h+r,w,h-r); A(w-r,h-r,r,0,90);
    L(w-r,h,-w+r,h); A(-w+r,h-r,r,90,180); L(-w,h-r,-w,-h+r); A(-w+r,-h+r,r,180,270);
  } else if(c.t==='dflat'){
    const R=c.d/2,f=Math.min(c.f,R-0.01),x=Math.sqrt(R*R-f*f),th=Math.atan2(f,x)*180/Math.PI;
    A(0,0,R,180-th,360+th); L(x,f,-x,f);
  } else if(c.t==='keyed'){
    const R=c.d/2,n=c.n/2,y0=Math.sqrt(R*R-n*n),k=c.k;
    const aS=Math.atan2(y0,-n)*180/Math.PI, aE=Math.atan2(y0,n)*180/Math.PI+360;
    A(0,0,R,aS,aE); L(n,y0,n,k); L(n,k,-n,k); L(-n,k,-n,y0);
  } else if(c.t==='trap'){
    const t=c.top/2,b=c.bot/2,h=c.h/2;
    L(-b,-h,b,-h); L(b,-h,t,h); L(t,h,-t,h); L(-t,h,-b,-h);
  }
  return {segs};
}
function xf(x,y,it){const a=rad(it.rot||0),c=Math.cos(a),s=Math.sin(a);return [it.x+x*c-y*s, it.y+x*s+y*c];}
function xfContour(k,it){
  if(k.circle){const [cx,cy]=xf(k.cx,k.cy,it);return {circle:true,cx,cy,r:k.r};}
  return {segs:k.segs.map(s=>{
    if(s.t==='L'){const [x1,y1]=xf(s.x1,s.y1,it),[x2,y2]=xf(s.x2,s.y2,it);return {t:'L',x1,y1,x2,y2};}
    const [cx,cy]=xf(s.cx,s.cy,it);return {t:'A',cx,cy,r:s.r,a1:s.a1+(it.rot||0),a2:s.a2+(it.rot||0)};
  })};
}
function holesFor(def,it,p){
  if(def.holes==='D'){
    const m=it.dfix||p.dfix, d=3.2;
    const all=[[-9.5,12],[9.5,12],[9.5,-12],[-9.5,-12]];
    const pick=m==='tlbr'?[all[0],all[2]]:m==='trbl'?[all[1],all[3]]:all;
    return pick.map(([x,y])=>{const [X,Y]=xf(x,y,it);return {x:X,y:Y,d};});
  }
  return (def.holes||[]).map(h=>{const [X,Y]=xf(h.x,h.y,it);return {x:X,y:Y,d:h.d};});
}
function geomOf(it,p){
  const def=defOf(it); if(!def) return null;
  const cuts=def.cut.map(c=>xfContour(contourLocal(c),it));
  const holes=holesFor(def,it,p);
  const rot=((it.rot||0)%180+180)%180===90;
  const fw=rot?def.flange.h:def.flange.w, fh=rot?def.flange.w:def.flange.h;
  return {def,cuts,holes,fw,fh,bbox:{x1:it.x-fw/2,x2:it.x+fw/2,y1:it.y-fh/2,y2:it.y+fh/2}};
}
function labelPos(it,g){
  const L=it.label||{}; if(!L.text||L.pos==='none') return null;
  const s=L.size||3, gap=L.gap??1.2;
  if(L.pos==='above') return {x:it.x,y:g.bbox.y2+gap+s/2,anchor:'middle',s};
  if(L.pos==='left') return {x:g.bbox.x1-gap,y:it.y,anchor:'end',s};
  if(L.pos==='right') return {x:g.bbox.x2+gap,y:it.y,anchor:'start',s};
  return {x:it.x,y:g.bbox.y1-gap-s/2,anchor:'middle',s};
}
function boxContour(b){return xfContour(contourLocal({t:'rect',w:b.w,h:b.h,r:b.r||0}),{x:b.x,y:b.y,rot:0});}
function panelOutline(p){const W=rackW(p),H=panelH(p);return {segs:[{t:'L',x1:0,y1:0,x2:W,y2:0},{t:'L',x1:W,y1:0,x2:W,y2:H},{t:'L',x1:W,y1:H,x2:0,y2:H},{t:'L',x1:0,y1:H,x2:0,y2:0}]};}
function mountContours(p){
  return mountHoles(p).map(h=>p.fix==='round'?{circle:true,cx:h.x,cy:h.y,r:3.25}:xfContour(contourLocal({t:'rect',w:10,h:6.5,r:3.25}),{x:h.x,y:h.y,rot:0}));
}
function arcPt(cx,cy,r,a){return [cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))];}
const logoOf=it=>logos.find(l=>l.id===it.logo);
function logoGeom(it){
  const L=logoOf(it); if(!L) return null;
  const w=it.w, h=w*L.ar, x0=it.x-w/2, y0=it.y-h/2;
  const polys=L.polys.map(f=>{const pts=[];for(let i=0;i<f.length;i+=2)pts.push([x0+f[i]*w,y0+f[i+1]*w]);
    const a=pts[0],b=pts[pts.length-1];return {pts,closed:Math.hypot(a[0]-b[0],a[1]-b[1])<w*0.002};});
  return {L,polys,w,h,bbox:{x1:x0,x2:x0+w,y1:y0,y2:y0+h}};

    if(b.x1<0.5||b.x2>W-0.5||b.y1<0.5||b.y2>H-0.5){out.push({lvl:'bad',id:i.id,msg:`${ref.get(i.id)} logo runs off the panel. Make it smaller or move it.`});bad.add(i.id);}

    if(hit){out.push({lvl:'bad',id:i.id,msg:`${ref.get(i.id)} logo sits under ${ref.get(hit.i.id)} ${hit.g.def.name}.`});bad.add(i.id);}}

      s+=`<rect data-hit="${it.id}" x="${f2(b.x1)}" y="${f2(H-b.y2)}" width="${f2(g.w)}" height="${f2(g.h)}" fill="transparent" style="cursor:move"><title>${esc(g.L.name)}</title></rect>`;
    }
  }
  // part-name annotations (drawing notes only — never engraved or cut)
  if(showNames){
    for(const it of p.items){ if(it.kind!=='part') continue; const g=geomOf(it,p); if(!g) continue;
      // aim for ~13px on screen at any zoom, but never wider or taller than the connector itself
      let nm=shortName(g.def);
      const fitW=Math.max(g.fw,10)*0.92/(Math.max(nm.length,3)*0.5), fitH=g.fh*0.8/2.3;
      const fs=Math.min(13/pxPerMm,fitW,fitH);
      const cy=H-it.y;
      s+=`<g pointer-events="none" font-family="Barlow Condensed, Arial Narrow, sans-serif" text-anchor="middle" fill="var(--accent)" stroke="var(--canvas)" stroke-width="${(fs*0.28).toFixed(2)}" paint-order="stroke" stroke-linejoin="round">
        <text x="${f2(it.x)}" y="${f2(cy-fs*0.55)}" font-size="${fs}" font-weight="700" dominant-baseline="central">${esc(ref.get(it.id))}</text>
        <text x="${f2(it.x)}" y="${f2(cy+fs*0.6)}" font-size="${fs.toFixed(2)}" font-weight="600" dominant-baseline="central">${esc(nm)}</text></g>`;
    }
  }
  if(guide) s+=`<path d="${guide}" stroke="var(--accent)" stroke-width=".25"/>`;
  // dims hint
  s+=`<text x="${W/2}" y="${H+7}" font-size="3.2" text-anchor="middle" fill="var(--muted)" font-family="JetBrains Mono, monospace">${f2(W)} × ${f2(H)} mm · ${p.U}U · ${p.thick} mm</text>`;
  svg.innerHTML=s;
}

/* ============ Library UI ============ */
function miniSvg(def){
  const fw=def.flange.w,fh=def.flange.h,m=Math.max(fw,fh)*0.08, H=fh;
  const it={x:fw/2,y:fh/2,rot:0};
  let s=`<svg viewBox="${-m} ${-m} ${fw+2*m} ${fh+2*m}" aria-hidden="true">`;
  s+=def.flange.round?`<circle cx="${fw/2}" cy="${fh/2}" r="${fw/2}" fill="none" stroke="var(--muted)" stroke-width="${fw*0.025}" stroke-dasharray="${fw*0.04} ${fw*0.03}"/>`
    :`<rect x="0" y="0" width="${fw}" height="${fh}" rx="${def.flange.r||0}" fill="none" stroke="var(--muted)" stroke-width="${fw*0.025}" stroke-dasharray="${fw*0.04} ${fw*0.03}"/>`;
  for(const c of def.cut) s+=shapeSvg(xfContour(contourLocal(c),it),H,`fill="var(--ink)"`);
  const hs=def.holes==='D'?[[-9.5,12],[9.5,-12]].map(([x,y])=>({x,y,d:3.2})):def.holes;
  for(const h of hs) s+=`<circle cx="${h.x+fw/2}" cy="${H-(h.y+fh/2)}" r="${h.d/2}" fill="var(--ink)"/>`;
  return s+'</svg>';
}
function renderLib(){
  const q=$('q').value.trim().toLowerCase();
  const defs=allDefs().filter(d=>!q||(d.name+' '+d.pn+' '+d.cat+' '+(d.desc||'')).toLowerCase().includes(q));
  const cats=[...new Set(defs.map(d=>d.cat))];
  let h='';
  const lg=logos.filter(l=>!q||('logo '+l.name).toLowerCase().includes(q));
  if(lg.length||!q){
    h+=`<div class="cat">Your logos</div>`;
    for(const l of lg) h+=`<button class="libitem" data-logo="${l.id}" title="Add ${esc(l.name)} to the panel"><svg viewBox="-0.05 -0.05 1.1 ${l.ar+0.1}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="${l.polys.map(f=>{let d='';for(let i=0;i<f.length;i+=2)d+=(i?'L':'M')+f[i]+' '+(l.ar-f[i+1]);return d;}).join('')}" fill="var(--ink)" fill-rule="evenodd"/></svg><span style="min-width:0"><div class="nm">${esc(l.name)}</div><div class="pn">Engraved logo</div></span><span></span></button>`;
    if(!q) h+=`<button class="libitem" data-upload="1"><svg viewBox="0 0 34 30" aria-hidden="true"><rect x="3" y="3" width="28" height="24" rx="3" fill="none" stroke="var(--muted)" stroke-dasharray="3 2"/><path d="M17 9v12M11 15h12" stroke="var(--accent)" stroke-width="2"/></svg><span style="min-width:0"><div class="nm">Upload logo</div><div class="pn">SVG, PNG or JPG</div></span><span></span></button>`;
  }
  for(const c of cats){
    h+=`<div class="cat">${esc(c)}</div>`;
    for(const d of defs.filter(x=>x.cat===c)) h+=`<button class="libitem${libCur===d.id?' cur':''}" data-def="${d.id}" title="Add ${esc(d.name)} to the panel">${miniSvg(d)}<span style="min-width:0"><div class="nm">${esc(d.name)}</div><div class="pn">${esc(d.pn)}</div></span><i class="dot ${d.conf}" title="${confText(d.conf)}"></i></button>`;
  }
  if(!defs.length) h=`<p class="note" style="padding:12px">Nothing matches “${esc(q)}”. Add it as a custom part below.</p>`;
  $('libList').innerHTML=h;
  $('libCount').textContent=allDefs().length+' parts';
  $('rPart').innerHTML=allDefs().map(d=>`<option value="${d.id}"${d.id===libCur?' selected':''}>${esc(d.name)} — ${esc(d.pn)}</option>`).join('');
}
const confText=c=>c==='high'?'Datasheet':c==='med'?'Check':'Verify';
function shortName(d){return d.short||d.name.replace(/\s*\(.*?\)/g,'').split(',')[0].trim();}

function addPart(id,x,y){
  const p=P(),def=allDefs().find(d=>d.id===id); if(!def) return;
  pushUndo();
  const H=panelH(p),W=rackW(p);
  if(x==null){ // find a free spot on the centre row, scanning out from the middle
    y=Math.min(H/2+ (def.flange.h<H-10?2.5:0), H-def.flange.h/2-1); if(y<def.flange.h/2+1) y=H/2;
    const op=opening(p),rl=(W-op)/2;
    const cands=[];for(let dx=0;dx<op/2;dx+=2.5){cands.push(W/2+dx);if(dx)cands.push(W/2-dx);}
    const fh=def.flange.h, ycands=[y];
    for(let dy=2.5;dy<H/2;dy+=2.5){for(const v of [y+dy,y-dy]) if(v-fh/2>=1&&v+fh/2<=H-1) ycands.push(v);}
    x=W/2; let found=false;
    for(const yy of ycands){ for(const c of cands){const t={id:'_',kind:'part',part:id,x:c,y:yy,rot:0};const g=geomOf(t,p);
      if(g.bbox.x1<rl||g.bbox.x2>W-rl) continue;
      if(!p.items.some(o=>{if(o.kind!=='part')return false;const og=geomOf(o,p);if(!og)return false;return !(og.bbox.x2+2<=g.bbox.x1||g.bbox.x2+2<=og.bbox.x1||og.bbox.y2+1<=g.bbox.y1||g.bbox.y2+1<=og.bbox.y1);})){x=c;y=yy;found=true;break;}}
      if(found) break; }
    if(!found) setTimeout(()=>toast('No free space left — placed in the centre. Try a taller panel.'),0);
  }
  const it={id:uid(),kind:'part',part:id,x:+(+x).toFixed(2),y:+(+y).toFixed(2),rot:0,label:{text:'',pos:'below',size:3}};
  p.items.push(it); sel=new Set([it.id]); libCur=id; renderAll(); renderLib();
}

/* ============ Inspector ============ */
function numField(id,label,val,step=0.1){return `<label class="field"><span>${label}</span><input type="number" id="${id}" step="${step}" value="${val}"></label>`;}
function renderInspector(){
  const p=P(),el=$('insp'); const items=p.items.filter(i=>sel.has(i.id)); const ref=refMap(p);

      <div><h3 style="font-size:15px;margin-bottom:6px">Checks</h3>${warnHtml(list)}</div>

      <div class="two">${numField('mPitch','Set pitch mm','',0.5)}<div class="field"><span>&nbsp;</span><button class="btn sm" data-act="pitch">Apply pitch</button></div></div>
      <div class="row"><button class="btn sm" data-act="dupe">Duplicate</button><button class="btn sm danger" data-act="del">Delete</button></div>

  const it=items[0];

    el.innerHTML=`<div class="row"><span class="chip ${def.conf}"><i class="dot ${def.conf}"></i>${confText(def.conf)}</span><span class="mono note">${esc(def.pn)}</span></div>
      <dl class="kv"><dt>Cutout</dt><dd>${esc(def.desc)}</dd><dt>Flange</dt><dd>${f2(def.flange.w)} × ${f2(def.flange.h)}${def.flange.round?' round':''}</dd>${def.note?`<dt>Note</dt><dd style="font-family:var(--f-body)">${esc(def.note)}</dd>`:''}${def.src?`<dt>Source</dt><dd><a href="${esc(def.src)}" target="_blank" rel="noopener">Datasheet</a></dd>`:''}</dl>
      <div class="two">${numField('iX','X mm',f2(it.x))}${numField('iY','Y mm',f2(it.y))}</div>
      <div class="two"><label class="field"><span>Rotation</span><select id="iRot">${[0,90,180,270].map(r=>`<option value="${r}"${(it.rot||0)===r?' selected':''}>${r}°</option>`).join('')}</select></label>
      ${def.holes==='D'?`<label class="field"><span>Screws</span><select id="iDfix"><option value="">Panel default</option><option value="four"${it.dfix==='four'?' selected':''}>All 4</option><option value="tlbr"${it.dfix==='tlbr'?' selected':''}>Top-L / bottom-R</option><option value="trbl"${it.dfix==='trbl'?' selected':''}>Top-R / bottom-L</option></select></label>`:'<span></span>'}</div>
      <label class="field"><span>Engraved label</span><input id="iLab" value="${esc(it.label?.text||'')}" placeholder="e.g. CH 1"></label>
      <div class="two"><label class="field"><span>Label position</span><select id="iLpos">${['below','above','left','right','none'].map(v=>`<option${(it.label?.pos||'below')===v?' selected':''}>${v}</option>`).join('')}</select></label>${numField('iLsize','Text height mm',it.label?.size||3,0.5)}</div>
      ${numField('iLgap','Label gap mm',it.label?.gap??1.2,0.1)}
      <div class="row"><button class="btn sm" data-act="dupe">Duplicate</button><button class="btn sm danger" data-act="del">Delete</button></div>
      ${warnHtml(list.filter(w=>w.id===it.id),true)}`;
    const upd=(fn)=>e=>{pushUndo();fn(e.target.value);persist();renderCanvas();renderSchedule();};
    $('iX').addEventListener('change',upd(v=>it.x=+v));
    $('iY').addEventListener('change',upd(v=>it.y=+v));
    $('iRot').addEventListener('change',upd(v=>it.rot=+v));
    $('iDfix')?.addEventListener('change',upd(v=>{if(v)it.dfix=v;else delete it.dfix;}));
    it.label=it.label||{text:'',pos:'below',size:3};
    $('iLab').addEventListener('input',e=>{it.label.text=e.target.value;persist();renderCanvas();renderSchedule();});
    $('iLab').addEventListener('focus',()=>pushUndo());
    $('iLpos').addEventListener('change',upd(v=>it.label.pos=v));
    $('iLsize').addEventListener('change',upd(v=>it.label.size=Math.max(1,+v)));
    $('iLgap').addEventListener('change',upd(v=>it.label.gap=+v));
  } else if(it.kind==='text'){

    el.innerHTML=`<label class="field"><span>Text</span><input id="tT" value="${esc(it.text)}"></label>

      <div class="row"><button class="btn sm" data-act="dupe">Duplicate</button><button class="btn sm danger" data-act="del">Delete</button></div>`;
    $('tT').addEventListener('focus',()=>pushUndo());
    $('tT').addEventListener('input',e=>{it.text=e.target.value;persist();renderCanvas();renderSchedule();});
    const upd=(fn)=>e=>{pushUndo();fn(e.target.value);persist();renderCanvas();renderSchedule();};
    $('iX').addEventListener('change',upd(v=>it.x=+v));$('iY').addEventListener('change',upd(v=>it.y=+v));$('tS').addEventListener('change',upd(v=>it.size=Math.max(1,+v)));
  } else if(it.kind==='logo'){
    const g=logoGeom(it);
    $('inspTitle').textContent=ref.get(it.id)+' · '+(g?g.L.name:'Logo');
    el.innerHTML=`<dl class="kv"><dt>Size</dt><dd>${g?f2(g.w)+' × '+f2(g.h)+' mm':'—'}</dd><dt>Outlines</dt><dd>${g?g.polys.length:0}</dd></dl>
      <div class="two">${numField('iX','Centre X',f2(it.x))}${numField('iY','Centre Y',f2(it.y))}</div>
      <div class="two">${numField('lW','Width mm',f2(it.w),0.5)}${numField('lH','Height mm',g?f2(g.h):'',0.5)}</div>
      <label class="field"><span>Engrave as</span><select id="lFill"><option value="1"${it.fill!==false?' selected':''}>Filled (solid logo)</option><option value="0"${it.fill===false?' selected':''}>Outline only</option></select></label>
      <p class="note" style="margin:0">Goes to the maker as closed outlines on the ENGRAVE layer. They fill it when “Filled” is chosen.</p>
      <div class="row"><button class="btn sm" data-act="dupe">Duplicate</button><button class="btn sm danger" data-act="del">Delete</button></div>
      <span id="lgDelWrap"><button class="btn sm" id="lgDel">Remove logo from library</button></span>`;
    const upd=(fn)=>e=>{pushUndo();fn(e.target.value);persist();renderCanvas();renderSchedule();renderInspector();};
    $('iX').addEventListener('change',upd(v=>it.x=+v));$('iY').addEventListener('change',upd(v=>it.y=+v));
    $('lW').addEventListener('change',upd(v=>it.w=Math.max(2,+v)));
    $('lH').addEventListener('change',upd(v=>{if(g&&g.L.ar>0)it.w=Math.max(2,+v/g.L.ar);}));
    $('lFill').addEventListener('change',upd(v=>it.fill=v==='1'));
    $('lgDel').onclick=()=>{const used=panels.reduce((n,pp)=>n+pp.items.filter(x=>x.kind==='logo'&&x.logo===it.logo).length,0);
      $('lgDelWrap').innerHTML=`<span class="confirm">Remove it from the library and from ${used} place${used===1?'':'s'} it’s used? <button class="btn sm danger" id="lgY">Remove</button><button class="btn sm" id="lgN">Keep</button></span>`;
      $('lgN').onclick=renderInspector;
      $('lgY').onclick=()=>{pushUndo();const lid=it.logo;logos=logos.filter(l=>l.id!==lid);panels.forEach(pp=>pp.items=pp.items.filter(x=>!(x.kind==='logo'&&x.logo===lid)));sel.clear();persist();renderLib();renderAll();};};
  } else {
    $('inspTitle').textContent=ref.get(it.id)+' · Engraved box';
    el.innerHTML=`<div class="two">${numField('iX','Centre X',f2(it.x))}${numField('iY','Centre Y',f2(it.y))}</div><div class="two">${numField('bW','Width',f2(it.w))}${numField('bH','Height',f2(it.h))}</div>${numField('bR','Corner radius',it.r||0)}
      <p class="note" style="margin:0">Engraved outline, for grouping connectors (e.g. "OUTPUTS").</p>
      <div class="row"><button class="btn sm" data-act="dupe">Duplicate</button><button class="btn sm danger" data-act="del">Delete</button></div>`;
    const upd=(fn)=>e=>{pushUndo();fn(e.target.value);persist();renderCanvas();renderSchedule();};
    $('iX').addEventListener('change',upd(v=>it.x=+v));$('iY').addEventListener('change',upd(v=>it.y=+v));
    $('bW').addEventListener('change',upd(v=>it.w=Math.max(1,+v)));$('bH').addEventListener('change',upd(v=>it.h=Math.max(1,+v)));$('bR').addEventListener('change',upd(v=>it.r=Math.max(0,+v)));
  }
}
function warnHtml(list,quiet){
  if(!list.length) return quiet?'':`<ul class="warnlist"><li class="ok">No clashes. Everything sits between the rails.</li></ul>`;
  return `<ul class="warnlist">${list.map(w=>`<li class="${w.lvl}">${esc(w.msg)}</li>`).join('')}</ul>`;
}
$('insp').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act, p=P();
  const items=p.items.filter(i=>sel.has(i.id)); if(!items.length) return;
  const order=[...sel].map(id=>p.items.find(i=>i.id===id)).filter(Boolean);
  pushUndo();
  if(a==='del'){p.items=p.items.filter(i=>!sel.has(i.id));sel.clear();}
  else if(a==='dupe'){const ns=new Set();for(const i of items){const c=JSON.parse(JSON.stringify(i));c.id=uid();c.x+=items.length>1?0:(geomOf(i,p)?.fw||10)+4;c.y+=items.length>1?-(10):0;p.items.push(c);ns.add(c.id);}sel=ns;}
  else if(a==='alignY'){const y=order[0].y;items.forEach(i=>i.y=y);}
  else if(a==='centreY'){const H=panelH(p);items.forEach(i=>i.y=+(H/2).toFixed(2));}
  else if(a==='centreX'){const xs=items.map(i=>i.x);const mid=(Math.min(...xs)+Math.max(...xs))/2,d=rackW(p)/2-mid;items.forEach(i=>i.x=+(i.x+d).toFixed(2));}
  else if(a==='dist'){const s=items.slice().sort((x,y)=>x.x-y.x),n=s.length;if(n>2){const st=(s[n-1].x-s[0].x)/(n-1);s.forEach((i,k)=>i.x=+(s[0].x+k*st).toFixed(2));}}
  else if(a==='pitch'){const pt=+$('mPitch').value;if(pt>0){const s=items.slice().sort((x,y)=>x.x-y.x);const mid=(s[0].x+s[s.length-1].x)/2,x0=mid-pt*(s.length-1)/2;s.forEach((i,k)=>i.x=+(x0+k*pt).toFixed(2));}}
  else if(a==='spread'){const s=items.slice().sort((x,y)=>x.x-y.x);const ws=s.map(i=>geomOf(i,p)?.fw||10);const op=opening(p),rl=(rackW(p)-op)/2;const gap=(op-ws.reduce((a,b)=>a+b,0))/(s.length+1);let x=rl+gap;s.forEach((i,k)=>{i.x=+(x+ws[k]/2).toFixed(2);x+=ws[k]+gap;});}
  persist();renderAll();
});

/* ============ Schedule ============ */
function renderSchedule(){
  const p=P(),ref=refMap(p),{bad}=checks(p);
  const rows=p.items.slice().sort((a,b)=>ref.get(a.id).localeCompare(ref.get(b.id)));
  $('schedBody').innerHTML=rows.map(it=>{
    const d=it.kind==='part'?defOf(it):null;
    const lgG=it.kind==='logo'?logoGeom(it):null;
    const name=it.kind==='part'?(d?.name||'?'):it.kind==='text'?'Engraved text':it.kind==='logo'?'Engraved logo':'Engraved box';
    const pn=it.kind==='part'?(d?.pn||''):it.kind==='text'?`${it.size} mm high`:it.kind==='logo'?(lgG?`${lgG.L.name} · ${f2(lgG.w)} × ${f2(lgG.h)}`:''):`${f2(it.w)} × ${f2(it.h)}`;
    const lab=it.kind==='part'?(it.label?.text||''):it.kind==='text'?it.text:'';
    const st=it.kind==='logo'&&bad.has(it.id)?`<span class="chip low">Off panel</span>`:it.kind==='part'?(bad.has(it.id)?`<span class="chip low">Clash</span>`:`<span class="chip ${d?.conf}">${confText(d?.conf)}</span>`):'';
    return `<tr data-row="${it.id}" class="${sel.has(it.id)?'sel':''}"><td class="mono">${ref.get(it.id)}</td><td>${esc(name)}</td><td class="mono" style="font-size:12px">${esc(pn)}</td><td class="num">${f2(it.x)}</td><td class="num">${f2(it.y)}</td><td>${esc(lab)}</td><td>${st}</td></tr>`;
  }).join('')||`<tr><td colspan="7" class="note">Click a part in the library to add it to the panel.</td></tr>`;
  const {list}=checks(p); const nb=list.filter(w=>w.lvl==='bad').length, nw=list.filter(w=>w.lvl==='warn').length;

    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(20);doc.text('KUDOS AV',16,18);doc.setFont('helvetica','normal');doc.text(`${p.name}  ·  Sheet ${pg} of 2`,PW-16,18,{align:'right'});doc.setLineWidth(0.2);doc.line(10,22,PW-10,22);};
  frame(1);
  const poly=(k)=>{
    if(k.circle){doc.circle(X(k.cx),Y(k.cy),k.r*sc,'S');return;}
    for(const s of k.segs){ if(s.t==='L') doc.line(X(s.x1),Y(s.y1),X(s.x2),Y(s.y2));
      else{const n=Math.max(6,Math.ceil((s.a2-s.a1)/6));let [px,py]=arcPt(s.cx,s.cy,s.r,s.a1);for(let i=1;i<=n;i++){const [qx,qy]=arcPt(s.cx,s.cy,s.r,s.a1+(s.a2-s.a1)*i/n);doc.line(X(px),Y(py),X(qx),Y(qy));px=qx;py=qy;}}}
  };
  // flange reference (dashed grey)
  doc.setDrawColor(170);doc.setLineWidth(0.12);doc.setLineDashPattern([1,0.8],0);
  for(const f of G.flanges){const b=f.b;if(f.round)doc.circle(X((b.x1+b.x2)/2),Y((b.y1+b.y2)/2),(b.x2-b.x1)/2*sc,'S');else doc.rect(X(b.x1),Y(b.y2),(b.x2-b.x1)*sc,(b.y2-b.y1)*sc);}
  doc.setLineDashPattern([],0);
  // outline + cuts
  doc.setDrawColor(0);doc.setLineWidth(0.35);poly(G.outline);
  doc.setLineWidth(0.25);[...G.mount,...G.cuts].forEach(poly);G.holes.forEach(h=>doc.circle(X(h.x),Y(h.y),h.d/2*sc,'S'));
  // engraving
  doc.setDrawColor(30,80,200);doc.setTextColor(30,80,200);doc.setLineWidth(0.18);G.boxes.forEach(poly);
  doc.setLineWidth(0.12);
  for(const lg of G.logos) for(const pl of lg.polys){const pts=pl.pts;for(let i=1;i<pts.length;i++)doc.line(X(pts[i-1][0]),Y(pts[i-1][1]),X(pts[i][0]),Y(pts[i][1]));if(pl.closed&&pts.length>2){const a=pts[pts.length-1],b=pts[0];doc.line(X(a[0]),Y(a[1]),X(b[0]),Y(b[1]));}}
  doc.setFont('helvetica','normal');
  for(const t of G.texts){doc.setFontSize(Math.max(4,t.s*sc*2.83));doc.text(t.text,X(t.x),Y(t.y),{align:t.anchor==='middle'?'center':t.anchor==='end'?'right':'left',baseline:'middle'});}
  // centre marks + refs
  doc.setDrawColor(200,40,40);doc.setLineWidth(0.1);
  for(const it of p.items){const cx=X(it.x),cy=Y(it.y);doc.line(cx-1.5,cy,cx+1.5,cy);doc.line(cx,cy-1.5,cx,cy+1.5);}
  doc.setTextColor(200,40,40);
  for(const it of p.items.filter(i=>i.kind==='part')){const g=geomOf(it,p);if(!g)continue;
    doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.text(ref.get(it.id),X(g.bbox.x2),Y(g.bbox.y2)-0.8,{align:'right'});
    // connector type, centred under the centre mark
    const wmm=Math.max(g.fw,24)*sc; doc.setFont('helvetica','bold');doc.setFontSize(6.5);
    let nm=shortName(g.def); while(nm.length>3&&doc.getTextWidth(nm)>wmm) nm=nm.slice(0,-2)+'…';
    doc.text(nm,X(it.x),Y(it.y)+4,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(5);let pn=g.def.pn;while(pn.length>3&&doc.getTextWidth(pn)>wmm) pn=pn.slice(0,-2)+'…';
    doc.text(pn,X(it.x),Y(it.y)+6.3,{align:'center'});}
  doc.setFont('helvetica','normal');
  // ordinate dims — X along the top
  doc.setTextColor(20);doc.setDrawColor(120);doc.setFontSize(6);doc.setLineWidth(0.08);
  const holes=mountHoles(p);
  const xs=[...new Set([0,W,...holes.map(h=>+h.x.toFixed(2)),...p.items.map(i=>+i.x.toFixed(2))])].sort((a,b)=>a-b);
  const top=Y(H);let last=-1e9;
  for(const x of xs){const px=X(x);const tx=Math.max(px,last+2.6);last=tx;
    doc.setDrawColor(205);doc.line(px,top,px,top-3);doc.setDrawColor(120);doc.line(px,top-3,tx,top-6);doc.line(tx,top-6,tx,top-7);
    doc.text(f2(x),tx+0.8,top-7.5,{angle:90});}
  // Y along the right
  const ys=[...new Set([0,H,...holes.map(h=>+h.y.toFixed(2)),...p.items.map(i=>+i.y.toFixed(2))])].sort((a,b)=>a-b);
  const right=X(W);last=1e9;
  for(const y of ys){const py=Y(y);const ty=Math.min(py,last-2.6);last=ty;
    doc.setDrawColor(205);doc.line(right,py,right+3,py);doc.setDrawColor(120);doc.line(right+3,py,right+6,ty);doc.line(right+6,ty,right+7,ty);
    doc.text(f2(y),right+7.5,ty+0.8);}
  // extension lines from features to edges (light)
  doc.setDrawColor(225);doc.setLineWidth(0.06);
  for(const it of p.items){doc.line(X(it.x),Y(it.y),X(it.x),top);doc.line(X(it.x),Y(it.y),right,Y(it.y));}
  // overall dims
  doc.setDrawColor(60);doc.setLineWidth(0.12);const by=Y(0)+8;doc.line(X(0),Y(0)+1,X(0),by+1);doc.line(X(W),Y(0)+1,X(W),by+1);doc.line(X(0),by,X(W),by);
  const arr=(x,y,dir)=>{doc.line(x,y,x+dir*2,y-0.7);doc.line(x,y,x+dir*2,y+0.7);};arr(X(0),by,1);arr(X(W),by,-1);
  doc.setFontSize(8);doc.setTextColor(20);doc.text(f2(W),X(W/2),by-1.2,{align:'center'});
  const lx=X(0)-8;doc.line(X(0)-1,Y(0),lx-1,Y(0));doc.line(X(0)-1,Y(H),lx-1,Y(H));doc.line(lx,Y(0),lx,Y(H));
  const arv=(x,y,dir)=>{doc.line(x,y,x-0.7,y+dir*2);doc.line(x,y,x+0.7,y+dir*2);};arv(lx,Y(H),1);arv(lx,Y(0),-1);
  doc.text(`${f2(H)} (${p.U}U)`,lx-1.5,Y(H/2),{angle:90,align:'center'});
  doc.setFontSize(7);doc.setTextColor(90);doc.text('ORIGIN 0,0',X(0)-1,Y(0)+4,{align:'right'});
  doc.setFontSize(7.5);doc.text('VIEWED FROM FRONT · ALL DIMENSIONS IN mm TO HOLE CENTRES FROM BOTTOM-LEFT CORNER',X(0),top-24);
  // notes
  const {list}=checks(p);
  const lows=[...new Set(p.items.filter(i=>i.kind==='part'&&defOf(i)?.conf==='low').map(i=>`${defOf(i).name} (${defOf(i).pn})`))];
  let notes=[`1. Material: ${p.thick} mm aluminium. Finish: ${({black:'black anodised',natural:'natural / clear anodised',white:'white powder coat'})[p.finish]}.`,
    `2. Engraving: text and outlines on layer ENGRAVE, infill ${p.finish==='black'?'white':'black'}. Set text in the maker's engraving font (DIN 1451 or similar) at the heights given.`,
    `3. Tolerance ±0.1 on holes and positions unless stated. Deburr all edges.`,
    `4. Rack fixings: ${p.fix==='slot'?'10 × 6.5 slots':'Ø6.5 holes'} at ${holePitch(p)} centres to EIA-310.`,
    `5. Neutrik D-size: ${p.dfix==='four'?'all 4 screw positions drilled so connectors fit either way round':p.dfix==='tlbr'?'screws top-left and bottom-right':'screws top-right and bottom-left'}.`];
  if(lows.length) notes.push(`6. CHECK BEFORE CUTTING — cutout taken from secondary sources: ${lows.join('; ')}.`);
  if(p.notes) notes.push(`${notes.length+1}. ${p.notes}`);
  if(list.some(w=>w.lvl==='bad')) notes.push(`DRAFT — layout has ${list.filter(w=>w.lvl==='bad').length} clash(es).`);
  doc.setFontSize(8);doc.setTextColor(20);doc.setFont('helvetica','bold');doc.text('NOTES',16,232);doc.setFont('helvetica','normal');
  let ny=237;for(const nt of notes){const lines=doc.splitTextToSize(nt,200);doc.text(lines,16,ny);ny+=lines.length*3.6+0.8;}
  // title block
  const tb=(x,y,w,h,label,val,big)=>{doc.setDrawColor(20);doc.setLineWidth(0.2);doc.rect(x,y,w,h);doc.setFontSize(5.5);doc.setTextColor(110);doc.text(label.toUpperCase(),x+1.5,y+3);doc.setTextColor(20);doc.setFontSize(big?13:8.5);doc.setFont('helvetica',big?'bold':'normal');doc.text(String(val||'—'),x+1.5,y+h-2.2,{maxWidth:w-3});doc.setFont('helvetica','normal');};
  const tx=228,ty=232;
  tb(tx,ty,182,15,'Panel',p.name,true);
  tb(tx,ty+15,91,10,'Job',p.job);tb(tx+91,ty+15,91,10,'Client',p.client);
  tb(tx,ty+25,46,10,'Size',`${p.rack}" ${p.U}U · ${f2(W)}×${f2(H)}`);tb(tx+46,ty+25,30,10,'Material',`${p.thick} mm Al`);tb(tx+76,ty+25,40,10,'Finish',({black:'Black anodised',natural:'Natural anod.',white:'White powder'})[p.finish]);tb(tx+116,ty+25,22,10,'Qty',p.qty);tb(tx+138,ty+25,22,10,'Scale (A3)',scTxt);tb(tx+160,ty+25,22,10,'Sheet','1 / 2');
  tb(tx,ty+35,91,10,'Drawn',`${p.by||''} · Kudos AV`);tb(tx+91,ty+35,91,10,'Date',today());
  // ===== Page 2 — schedule
  doc.addPage('a3','landscape');frame(2);
  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('CUTOUT AND ENGRAVING SCHEDULE',16,32);
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(90);doc.text('X and Y are centre positions in mm from the bottom-left corner of the panel, viewed from the front. Rotation is anticlockwise.',16,37);
  const cols=[['Ref',14],['Part',62],['Part no.',44],['X',20],['Y',20],['Rot',12],['Cutout',138],['Engraving',48],['Status',30]];
  let y=44,x0=16;
  const head=()=>{doc.setFillColor(235,238,242);doc.rect(x0,y-4,cols.reduce((a,c)=>a+c[1],0),6.5,'F');doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(20);let x=x0;for(const [h,w] of cols){doc.text(h,['X','Y','Rot'].includes(h)?x+w-2:x+1.5,y,{align:['X','Y','Rot'].includes(h)?'right':'left'});x+=w;}doc.setFont('helvetica','normal');y+=6;};
  head();
  const rows=scheduleRows(p);
  rows.unshift({ref:'M',name:'Rack fixings',pn:'EIA-310',x:null,y:null,rot:0,cut:`${holes.length}× ${p.fix==='slot'?'slot 10 × 6.5 (horizontal)':'Ø6.5'} at X ${f2(holes[0].x)} / ${f2(W-holes[0].x)}, Y ${[...new Set(holes.map(h=>f2(h.y)))].join(' / ')}`,eng:'',conf:''});
  for(const r of rows){
    const cells=[r.ref,r.name,r.pn,r.x==null?'':f2(r.x),r.y==null?'':f2(r.y),r.x==null?'':r.rot+'°',r.cut,r.eng,r.conf==='high'?'Datasheet':r.conf==='med'?'Check':r.conf==='low'?'VERIFY':''];
    const wrapped=cells.map((c,i)=>doc.splitTextToSize(String(c),cols[i][1]-3));
    const h=Math.max(...wrapped.map(w=>w.length))*3.3+2.2;
    if(y+h>PH-16){doc.addPage('a3','landscape');frame(2);y=32;head();}
    let x=x0;doc.setFontSize(7.5);
    wrapped.forEach((w,i)=>{const num=[3,4,5].includes(i);if(i===8&&r.conf==='low')doc.setTextColor(200,40,40);else doc.setTextColor(20);doc.text(w,num?x+cols[i][1]-2:x+1.5,y,{align:num?'right':'left'});x+=cols[i][1];});
    doc.setDrawColor(215);doc.setLineWidth(0.1);doc.line(x0,y+h-3.2,x0+cols.reduce((a,c)=>a+c[1],0),y+h-3.2);
    y+=h;
  }
  return doc.output('arraybuffer');
}
async function saveFile(filename,data,mime){
  const c=window.claude;
  if(c&&typeof c.use==='function'){
    let dl=null; try{dl=await c.use('downloads');}catch(e){}
    if(dl){try{await dl.save({filename,data});toast('Saved '+filename);}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rejected_extension'){toast('This file type can’t be saved here — use Fabrication pack (.zip).');return;}toast('Couldn’t save: '+(e&&e.message||'unknown error'));}return;}
    toast('Downloads aren’t available in this view. Open the HTML copy in your Dropbox folder.');return;
  }
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);toast('Saved '+filename);
}
function guardClash(){const n=checks(P()).list.filter(w=>w.lvl==='bad').length;if(n)toast(`Exported as DRAFT — ${n} clash${n>1?'es':''} to fix first`);}
$('bPdf').onclick=async()=>{if(!window.jspdf){toast('PDF library didn’t load. Check your connection and reload.');return;}guardClash();await saveFile(slug()+'-drawing.pdf',new Uint8Array(makePDF(P())),'application/pdf');};
$('bSvg').onclick=()=>saveFile(slug()+'.svg',makeSVG(P()),'image/svg+xml');
$('bDxf').onclick=()=>{guardClash();saveFile(slug()+'.dxf',makeDXF(P(),false),'application/dxf');};
$('bSave').onclick=()=>{const p=P();const used=new Set(p.items.map(i=>i.part));saveFile(slug()+'.rackpanel.json',JSON.stringify({app:'kudos-rack-panel',v:1,panel:p,customs:customs.filter(c=>used.has(c.id)),logos:logos.filter(l=>p.items.some(i=>i.logo===l.id))},null,1),'application/json');};
$('bOpen').onclick=()=>$('fileIn').click();
$('fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.panel||!Array.isArray(j.panel.items))throw 0;for(const c of j.customs||[])if(!customs.some(x=>x.id===c.id))customs.push(c);for(const l of j.logos||[])if(!logos.some(x=>x.id===l.id))logos.push(l);j.panel.id=uid();panels.push(j.panel);cur=panels.length-1;sel.clear();undo=[];redo=[];persist();renderLib();renderAll();toast('Opened '+j.panel.name);}catch(err){toast('That file isn’t a rack panel project (.rackpanel.json).');}e.target.value='';};r.readAsText(f);});
$('bZip').onclick=async()=>{
  if(!window.JSZip||!window.jspdf){toast('Export libraries didn’t load. Check your connection and reload.');return;}
  guardClash();
  const p=P(),z=new JSZip(),s=slug(),{list}=checks(p);
  z.file(s+'.dxf',makeDXF(p,false));
  z.file(s+'-with-reference.dxf',makeDXF(p,true));
  z.file(s+'-drawing.pdf',makePDF(p));
  z.file(s+'.svg',makeSVG(p));
  const used=new Set(p.items.map(i=>i.part));
  z.file(s+'.rackpanel.json',JSON.stringify({app:'kudos-rack-panel',v:1,panel:p,customs:customs.filter(c=>used.has(c.id)),logos:logos.filter(l=>p.items.some(i=>i.logo===l.id))},null,1));
  const rows=scheduleRows(p);
  z.file('README.txt',[`${p.name} — ${p.job||''}`,`Kudos AV · ${p.by||''} · ${today()}`,'',`${p.rack}" rack panel, ${p.U}U (${f2(rackW(p))} x ${f2(panelH(p))} mm), ${p.thick} mm aluminium, ${p.finish}. Qty ${p.qty}.`,'',
    'FILES',`  ${s}.dxf                 Cut + engrave (layers OUTLINE, CUT, ENGRAVE). Units mm, origin bottom-left, front view.`,`  ${s}-with-reference.dxf  As above plus REFERENCE_NO_CUT layer showing connector flanges. Do not cut that layer.`,`  ${s}-drawing.pdf         Dimensioned drawing and cutout schedule (A3).`,`  ${s}.svg                 Same geometry for laser software (red cut, blue engrave).`,`  ${s}.rackpanel.json      Project file for the Kudos Rack Panel Designer.`,'',
    'CUTOUT SCHEDULE (X, Y centre from bottom-left, mm)',...rows.map(r=>`  ${r.ref.padEnd(4)} ${String(r.name).padEnd(34)} X ${f2(r.x).padStart(7)}  Y ${f2(r.y).padStart(6)}  ${r.cut}${r.eng?'  ["'+r.eng+'"]':''}${r.conf==='low'?'  ** VERIFY **':''}`),
    '',...(list.length?['CHECKS',...list.map(w=>'  - '+w.msg)]:['CHECKS','  No clashes.']),''].join('\r\n'));
  const blob=await z.generateAsync({type:'blob'});
  await saveFile(s+'-fabrication-pack.zip',blob,'application/zip');
};

let toastT;function toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200);}
function renderAll(){syncSettings();renderCanvas();renderSchedule();renderInspector();$('bUndo').disabled=!undo.length;$('bRedo').disabled=!redo.length;}
load(); bindDel();
if(!(window.claude&&typeof window.claude.use==='function')) $('bDxf').hidden=false;
renderLib(); renderAll();
window.__rack={makeDXF,makeSVG,makePDF,P:()=>P(),checks,LIB,addPart,panels:()=>panels};
})();
